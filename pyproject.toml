[project]
name = "xiuxian-art-tools"
version = "0.1.0"
description = "修仙角色外观编辑器的离线美术素材工具环境"
license = { file = "LICENSE" }
authors = [{ name = "lovekeqing" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "Pillow==12.2.0", "scipy==1.15.3"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.uv]
package = false

# uv.lock 必须以官方 PyPI（默认 index）生成；国内镜像仅通过 UV_DEFAULT_INDEX 环境变量临时覆盖，勿写入本文件。
